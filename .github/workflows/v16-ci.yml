name: V16 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: pyh_v16_phase4_test
          MYSQL_USER: pyh_ci
          MYSQL_PASSWORD: disposable-ci-only
          MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      APP_ENV: test
      APP_TIMEZONE: UTC
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: 3306
      # Exact disposable name required by TestDatabasePolicy and Phase 4 tests.
      TEST_DB_DATABASE: pyh_v16_phase4_test
      TEST_DB_USERNAME: pyh_ci
      TEST_DB_PASSWORD: disposable-ci-only
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, fileinfo, mbstring, dom, xml, xmlwriter
          tools: composer:v2
          coverage: none

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: PHP syntax check
        run: find app config public src tests -type f -name '*.php' -print0 | xargs -0 -n 1 php -l

      - name: Install canonical test schema
        run: |
          DB_HOST="$TEST_DB_HOST" DB_PORT="$TEST_DB_PORT" \
          DB_DATABASE="$TEST_DB_DATABASE" DB_USERNAME="$TEST_DB_USERNAME" \
          DB_PASSWORD="$TEST_DB_PASSWORD" php app/console.php install

      - name: PHPUnit
        run: composer test

      - name: PHPStan level 8
        run: composer analyse

      - name: Repository whitespace check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git diff --check
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "$BASE_SHA" HEAD
          else
            git show --format= --check HEAD
          fi
